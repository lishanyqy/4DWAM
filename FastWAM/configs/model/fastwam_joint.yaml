_target_: fastwam.runtime.create_fastwam_joint
model_id: /data/checkpoints/Wan-AI/Wan2.2-TI2V-5B/
tokenizer_model_id: /data/checkpoints/Wan-AI/Wan2.1-T2V-1.3B
vae_path: /data/checkpoints/DiffSynth-Studio/Wan-Series-Converted-Safetensors/Wan2.2_VAE.safetensors
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: /data/checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

traceanything:
  enabled: true
  root: ./src/TraceAnything
  config: ./src/TraceAnything/configs/eval.yaml
  ckpt: /root/.cache/models/trace-anything/trace_anything.pt
  camera_order:
    - cam_high
    - cam_left_wrist
    - cam_right_wrist
  camera_sizes:
    cam_high: [256, 320]
    cam_left_wrist: [128, 160]
    cam_right_wrist: [128, 160]
  spatial_layout: auto
  align_to_video_patch: true
  max_frames: null
  align_layer: 20
  alignment_target_dim: 2048
  loss_weight: 0.01
  enable_dest_loss: true
  enable_motion_loss: true
  dest_loss_weight: 1.0
  motion_loss_weight: 0.5
